[project]
name = "taintbox"
version = "0.1.0"
description = "A Taint-Tracked Sandbox Runtime and Agent-Computer Interface for AI Agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0",
    "polars>=1.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
