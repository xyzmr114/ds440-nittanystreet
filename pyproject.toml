[project]
name = "ds440-tca"
version = "0.1.0"
description = "Cross Asset Transaction Cost Analysis and Market Elasticity Engine"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15.0",
    "py_vollib>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
